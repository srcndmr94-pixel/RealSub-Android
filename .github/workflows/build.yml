name: RealSub APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Telefon APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imza anahtari
        run: |
          set -e
          # Sabit imza olmazsa her derleme baska bir anahtarla imzalanir ve
          # yeni APK eskisinin ustune kurulmaz. Anahtar bir kez uretilip
          # depoya yazilir, sonraki derlemeler ayni anahtari kullanir.
          if [ ! -f realsub.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore realsub.keystore -storepass realsub -keypass realsub \
              -alias realsub -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RealSub, O=RealSub, L=Istanbul, C=TR"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add realsub.keystore
            git commit -m "Imza anahtari olusturuldu"
            git push
            echo "Imza anahtari uretildi ve depoya yazildi."
          else
            echo "Imza anahtari zaten var."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Kaynagi hazirla
        id: src
        run: |
          set -e
          # Depodaki en yuksek surumlu zip secilir; yoksa depo kokunden derlenir.
          ZIP=""
          for f in *.zip; do
            [ -e "$f" ] || continue
            case "$(echo "$f" | tr 'A-Z' 'a-z')" in *realsub*) ;; *) continue ;; esac
            v=$(echo "$f" | grep -oE '[0-9]+(\.[0-9]+)*' | sort -V | tail -n 1)
            echo "${v:-0}|$f"
          done | sort -V | tail -n 1 > /tmp/pick || true
          ZIP=$(cut -d'|' -f2 /tmp/pick 2>/dev/null || true)
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Kaynak zip: $ZIP"
            rm -rf kaynak && mkdir kaynak
            unzip -q "$ZIP" -d kaynak
            DIR=$(find kaynak -maxdepth 3 -name settings.gradle.kts -printf '%h\n' | head -n 1)
            if [ -z "$DIR" ]; then echo "Zip icinde proje bulunamadi"; exit 1; fi
            echo "Proje klasoru: $DIR"
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          else
            echo "Zip yok; depo kokunden derlenecek."
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Derle
        working-directory: ${{ steps.src.outputs.dir }}
        env:
          REALSUB_KEYSTORE: ${{ github.workspace }}/realsub.keystore
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: RealSub-APK-${{ github.run_number }}
          path: ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
